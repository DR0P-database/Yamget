[project]
name = "music-project"
description = "Yamget: CLI-загрузчик Яндекс Музыки"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["downloader-app"]

[tool.uv.workspace]
members = ["music_download", "downloader_app"]

[tool.uv.sources]
music_download = { workspace = true }
downloader_app = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

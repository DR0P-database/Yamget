[project]
name = "music-download"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["yandex-music", "mutagen>=1.47", "pathvalidate>=3.3,<4"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "engine.py", "formats.py", "index.py", "relocation.py", "models.py", "paths.py", "queue.py", "service.py", "sources.py", "tags.py", "providers"]

[tool.hatch.build.targets.wheel.sources]
"" = "music_download"
